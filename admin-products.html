<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Products | MarketVerse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
    <link href="assets/css/responsive.css" rel="stylesheet">
  </head>
  <body data-page="admin-products" data-layout="admin" data-page-title="Admin Products" data-breadcrumb="Home|index.html>Admin Dashboard|admin-dashboard.html">
    <div id="siteHeader"></div>
    <div id="breadcrumbShell"></div>

    <main class="section-space-sm">
      <div class="container">
        <div class="admin-shell">
          <aside class="side-menu">
            <h3 class="h5 fw-bold mb-3">Admin Menu</h3>
            <a href="admin-dashboard.html"><i class="bi bi-speedometer2"></i>Overview</a>
            <a class="active" href="admin-products.html"><i class="bi bi-box-seam"></i>Products</a>
            <a href="admin-orders.html"><i class="bi bi-receipt"></i>Orders</a>
            <a href="admin-customers.html"><i class="bi bi-people"></i>Customers</a>
            <a href="admin-inventory.html"><i class="bi bi-archive"></i>Inventory</a>
            <a href="index.html"><i class="bi bi-shop"></i>View Storefront</a>
          </aside>

          <div class="table-card">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
              <div>
                <h2 class="h4 fw-bold mb-1">Product Management</h2>
                <p class="text-muted-custom mb-0">The admin product table is rendered from the same product dataset used on the storefront.</p>
              </div>
              <button class="btn btn-primary" type="button" data-bs-toggle="modal" data-bs-target="#addProductModal">
                <i class="bi bi-plus-circle me-2"></i>Add Product
              </button>
            </div>
            <div class="table-responsive">
              <table class="table align-middle mb-0">
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Product</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th>Status</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="adminProductsTable"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div class="modal fade" id="addProductModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header border-0 pb-0">
            <h2 class="modal-title h5 fw-bold">Add Product</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body pt-3">
            <form id="addProductForm">
              <div class="mb-3">
                <label class="form-label">Product Name</label>
                <input type="text" class="form-control" placeholder="Product title" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Category</label>
                <select class="form-select" required>
                  <option value="">Select category</option>
                  <option>Electronics</option>
                  <option>Fashion</option>
                  <option>Home Decor</option>
                  <option>Beauty</option>
                  <option>Sports</option>
                  <option>Grocery</option>
                </select>
              </div>
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">Price</label>
                  <input type="number" class="form-control" placeholder="99" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Stock</label>
                  <input type="number" class="form-control" placeholder="24" required>
                </div>
              </div>
              <button class="btn btn-primary w-100 mt-4" type="submit">Save Product</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="editProductModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header border-0 pb-0">
            <h2 class="modal-title h5 fw-bold">Edit Product</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body pt-3">
            <form id="editProductForm">
              <input type="hidden" id="editProductId">
              <div class="mb-3">
                <label class="form-label">Product Name</label>
                <input type="text" class="form-control" id="editProductName" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Category</label>
                <input type="text" class="form-control" id="editProductCategory" required>
              </div>
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">Price</label>
                  <input type="number" class="form-control" id="editProductPrice" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Stock</label>
                  <input type="number" class="form-control" id="editProductStock" required>
                </div>
              </div>
              <button class="btn btn-primary w-100 mt-4" type="submit">Update Product</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <div id="siteFooter"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/products.js"></script>
    <script src="assets/js/cart.js"></script>
  </body>
</html>
