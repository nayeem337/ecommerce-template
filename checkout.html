<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | MarketVerse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
    <link href="assets/css/responsive.css" rel="stylesheet">
  </head>
  <body data-page="checkout" data-page-title="Checkout" data-breadcrumb="Home|index.html>Cart|cart.html">
    <div id="siteHeader"></div>
    <div id="breadcrumbShell"></div>

    <main class="section-space-sm">
      <div class="container">
        <div class="row g-4">
          <div class="col-xl-8">
            <div class="summary-card">
              <div class="d-flex align-items-center justify-content-between flex-wrap gap-3 mb-4">
                <div>
                  <h2 class="h4 fw-bold mb-1">Shipping & Payment</h2>
                  <p class="text-muted-custom mb-0">Frontend-only checkout flow with polished forms and payment option cards.</p>
                </div>
                <a href="cart.html" class="btn btn-outline-secondary">Back to Cart</a>
              </div>
              <form id="checkoutForm">
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label">First Name</label>
                    <input type="text" class="form-control" placeholder="John" required>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Last Name</label>
                    <input type="text" class="form-control" placeholder="Doe" required>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-control" placeholder="john@example.com" required>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Phone Number</label>
                    <input type="tel" class="form-control" placeholder="+1 555 678 900" required>
                  </div>
                  <div class="col-12">
                    <label class="form-label">Street Address</label>
                    <input type="text" class="form-control" placeholder="742 Evergreen Terrace" required>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label">City</label>
                    <input type="text" class="form-control" placeholder="Seattle" required>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label">State</label>
                    <input type="text" class="form-control" placeholder="Washington" required>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label">Zip Code</label>
                    <input type="text" class="form-control" placeholder="98101" required>
                  </div>
                </div>

                <div class="mt-5">
                  <h3 class="h5 fw-semibold mb-3">Payment Method</h3>
                  <div class="row g-3">
                    <div class="col-md-4">
                      <div class="payment-option">
                        <input type="radio" id="payment-cod" name="paymentMethod" checked>
                        <label for="payment-cod">
                          <strong class="d-block mb-1">Cash on Delivery</strong>
                          <span class="text-muted-custom small">Pay when the package arrives.</span>
                        </label>
                      </div>
                    </div>
                    <div class="col-md-4">
                      <div class="payment-option">
                        <input type="radio" id="payment-card" name="paymentMethod">
                        <label for="payment-card">
                          <strong class="d-block mb-1">Credit / Debit Card</strong>
                          <span class="text-muted-custom small">Frontend demo styling for secure cards.</span>
                        </label>
                      </div>
                    </div>
                    <div class="col-md-4">
                      <div class="payment-option">
                        <input type="radio" id="payment-mobile" name="paymentMethod">
                        <label for="payment-mobile">
                          <strong class="d-block mb-1">Mobile Banking</strong>
                          <span class="text-muted-custom small">Quick-pay UI for wallet apps.</span>
                        </label>
                      </div>
                    </div>
                  </div>
                </div>

                <div class="mt-5">
                  <button id="placeOrderButton" class="btn btn-primary btn-lg" type="submit">Place Order</button>
                </div>
              </form>
            </div>
          </div>
          <div class="col-xl-4">
            <div class="summary-card">
              <h3 class="h5 fw-semibold mb-3">Order Summary</h3>
              <div id="checkoutSummary"></div>
              <div class="summary-row"><span>Subtotal</span><strong id="checkoutSubtotal">$0</strong></div>
              <div class="summary-row"><span>Shipping</span><strong id="checkoutShipping">Free</strong></div>
              <div class="summary-row"><span>Total</span><strong id="checkoutTotal">$0</strong></div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div id="siteFooter"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/products.js"></script>
    <script src="assets/js/cart.js"></script>
  </body>
</html>
