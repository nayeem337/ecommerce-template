<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart | MarketVerse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
    <link href="assets/css/responsive.css" rel="stylesheet">
  </head>
  <body data-page="cart" data-page-title="Shopping Cart" data-breadcrumb="Home|index.html>Products|products.html">
    <div id="siteHeader"></div>
    <div id="breadcrumbShell"></div>

    <main class="section-space-sm">
      <div class="container">
        <div class="row g-4">
          <div class="col-xl-8">
            <div class="table-card">
              <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3 mb-4">
                <div>
                  <h2 class="h4 fw-bold mb-1">Your cart</h2>
                  <p class="text-muted-custom mb-0">Update quantities, remove items, and preview the order total before checkout.</p>
                </div>
                <a href="products.html" class="btn btn-outline-secondary">Continue Shopping</a>
              </div>
              <div class="table-responsive">
                <table class="table cart-table align-middle mb-0">
                  <thead>
                    <tr>
                      <th>Product</th>
                      <th>Price</th>
                      <th>Quantity</th>
                      <th>Total</th>
                      <th class="text-end">Action</th>
                    </tr>
                  </thead>
                  <tbody id="cartItemsBody">
                    <tr>
                      <td colspan="5">
                        <div class="skeleton-card">
                          <div class="skeleton skeleton-line"></div>
                          <div class="skeleton skeleton-line"></div>
                          <div class="skeleton skeleton-line short"></div>
                        </div>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
          <div class="col-xl-4">
            <div class="summary-card mb-4">
              <h3 class="h5 fw-semibold mb-3">Cart Summary</h3>
              <div class="summary-row"><span>Subtotal</span><strong id="cartSubtotal">$0</strong></div>
              <div class="summary-row"><span>You Save</span><strong id="cartSavings">$0</strong></div>
              <div class="summary-row"><span>Shipping</span><strong id="cartShipping">Free</strong></div>
              <div class="summary-row"><span>Total</span><strong id="cartTotal">$0</strong></div>
              <a id="checkoutButton" href="checkout.html" class="btn btn-primary w-100 mt-4">Proceed to Checkout</a>
            </div>

            <div class="coupon-box">
              <h3 class="h6 fw-semibold mb-2">Apply Coupon</h3>
              <p class="text-muted-custom small mb-3">Demo UI only. Use any code to trigger the toast notification.</p>
              <form id="couponForm">
                <div class="input-group">
                  <input type="text" class="form-control" placeholder="Enter coupon code" required>
                  <button class="btn btn-primary" type="submit">Apply</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div id="siteFooter"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/products.js"></script>
    <script src="assets/js/cart.js"></script>
  </body>
</html>
