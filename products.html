<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products | MarketVerse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
    <link href="assets/css/responsive.css" rel="stylesheet">
  </head>
  <body data-page="products" data-page-title="Products" data-breadcrumb="Home|index.html">
    <div id="siteHeader"></div>
    <div id="breadcrumbShell"></div>

    <main class="section-space-sm">
      <div class="container">
        <div class="row g-4">
          <div class="col-xl-3">
            <aside class="filter-card">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="fw-semibold mb-0">Filters</h5>
                <a href="products.html" class="small mini-link">Reset</a>
              </div>

              <div class="mb-4">
                <h6 class="fw-semibold mb-3">Category</h6>
                <div id="categoryFilterList"></div>
              </div>

              <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center mb-2">
                  <h6 class="fw-semibold mb-0">Price Range</h6>
                  <span class="text-muted-custom small" id="priceRangeValue">$0</span>
                </div>
                <input class="form-range" type="range" id="priceRange" min="0" value="0">
              </div>

              <div class="mb-4">
                <h6 class="fw-semibold mb-2">Minimum Rating</h6>
                <select class="form-select" id="ratingFilter">
                  <option value="0">All ratings</option>
                  <option value="4">4 stars & up</option>
                  <option value="4.5">4.5 stars & up</option>
                </select>
              </div>

              <div class="mb-0">
                <h6 class="fw-semibold mb-3">Availability</h6>
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" value="" id="availabilityFilter">
                  <label class="form-check-label" for="availabilityFilter">In stock only</label>
                </div>
              </div>
            </aside>
          </div>
          <div class="col-xl-9">
            <div class="toolbar-box d-flex flex-column flex-lg-row justify-content-between align-items-lg-center gap-3 mb-4">
              <div>
                <strong class="d-block" id="productsCount">0 products found</strong>
                <span class="text-muted-custom small" id="activeSearchText">Browse the latest catalog</span>
              </div>
              <div class="d-flex align-items-center gap-3">
                <label for="sortProducts" class="text-muted-custom small mb-0">Sort by</label>
                <select class="form-select" id="sortProducts">
                  <option value="latest">Latest</option>
                  <option value="rating">Top Rated</option>
                  <option value="discount">Best Discount</option>
                  <option value="price-asc">Price: Low to High</option>
                  <option value="price-desc">Price: High to Low</option>
                </select>
              </div>
            </div>
            <div id="productsGrid" class="row g-4"></div>
            <nav class="mt-5" aria-label="Products pagination">
              <ul id="paginationHolder" class="pagination justify-content-center"></ul>
            </nav>
          </div>
        </div>
      </div>
    </main>

    <div id="siteFooter"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/products.js"></script>
    <script src="assets/js/cart.js"></script>
  </body>
</html>
