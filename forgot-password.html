<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | MarketVerse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
    <link href="assets/css/responsive.css" rel="stylesheet">
  </head>
  <body data-page="forgot-password" data-page-title="Forgot Password" data-breadcrumb="Home|index.html>Login|login.html">
    <div id="siteHeader"></div>
    <div id="breadcrumbShell"></div>

    <main class="section-space-sm">
      <div class="container auth-shell">
        <div class="row justify-content-center w-100">
          <div class="col-lg-6">
            <div class="auth-card">
              <span class="section-kicker">Password Reset</span>
              <h1 class="h2 fw-bold mt-3 mb-2">Reset your password with a calm, clean recovery flow.</h1>
              <p class="text-muted-custom mb-4">Enter your email and the demo UI will trigger a polished confirmation toast.</p>
              <form data-demo-submit="forgot" data-success-message="Password reset link sent successfully." data-redirect="login.html">
                <div class="mb-3">
                  <label class="form-label">Email Address</label>
                  <input type="email" class="form-control" placeholder="you@example.com" required>
                </div>
                <button class="btn btn-primary w-100" type="submit">Send Reset Link</button>
              </form>
              <p class="text-muted-custom mt-4 mb-0">Remembered your password? <a href="login.html" class="mini-link">Back to login</a></p>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div id="siteFooter"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/products.js"></script>
    <script src="assets/js/cart.js"></script>
  </body>
</html>
